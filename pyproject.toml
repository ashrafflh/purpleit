[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "purplestrike"
version = "0.1.0"
description = "AI-driven breach and attack simulation for SIEM detection validation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["security", "bas", "attack-simulation", "mitre", "attck", "siem", "wazuh", "purple-team"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "aiosqlite>=0.19.0",
    "pywinrm>=0.4.0",
]

[project.optional-dependencies]
openai = ["openai>=1.12.0"]
deepseek = ["openai>=1.12.0"]
anthropic = ["anthropic>=0.18.0"]
ollama = ["ollama>=0.4.0"]
ssh = ["asyncssh>=2.14.0"]
all = [
    "purplestrike[openai,deepseek,anthropic,ollama,ssh]",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "respx>=0.21.0",
]

[project.scripts]
purplestrike = "purplestrike.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/purplestrike"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["purplestrike"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pywinrm.*", "asyncssh.*", "ollama.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["purplestrike"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
